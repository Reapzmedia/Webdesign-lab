<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector Example 1</title>
  <link rel="stylesheet" type="text/css" href="StyleSheet.css">
</head>
<body>
  <div>My Style</div>
  <br>
  <div>
    <h3>My Style</h3>
    <h2>My Style</h2>
  </div>
  <div>
    <h3>My Style</h3>
    <div>
      <li>
        My style
        <h2>My Style</h2>
      </li>
      <h1>My Style</h1>
    </div>
  </div>
  <h1>My Style</h1>
  <p class="note">My Style</p>
</body>
</html>
