<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 04 - Practice Task 2 (Student Management)</title>
  <!-- Bootstrap 4.5.2 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container my-5">
    <h2 class="text-center mb-4">Student Management</h2>

    <!-- Registration Form Card -->
    <div class="card shadow-sm mb-5">
      <div class="card-header bg-white">
        <h5 class="mb-0">Register Form</h5>
      </div>
      <div class="card-body">
        <form>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="studentName">Name</label>
              <input type="text" class="form-control" id="studentName" placeholder="Enter student name" required>
            </div>
            <div class="form-group col-md-6">
              <label for="education">Education</label>
              <input type="text" class="form-control" id="education" placeholder="BSCS / BBA / etc.">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="address">Address</label>
              <input type="text" class="form-control" id="address" placeholder="Islamabad / Rawalpindi">
            </div>
            <div class="form-group col-md-4">
              <label for="gender">Gender</label>
              <select id="gender" class="form-control">
                <option selected>Choose...</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group col-md-2">
              <label for="age">Age</label>
              <input type="number" class="form-control" id="age" min="1" max="100">
            </div>
          </div>

          <div class="form-group">
            <label for="cnicFile">Choose valid CNIC file...</label>
            <div class="custom-file">
              <input type="file" class="custom-file-input" id="cnicFile">
              <label class="custom-file-label" for="cnicFile">Browse</label>
            </div>
          </div>

          <div class="form-group">
            <label for="about">About Yourself</label>
            <textarea class="form-control" id="about" rows="3"></textarea>
          </div>

          <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="termsCheck" required>
            <label class="form-check-label" for="termsCheck">Agree to terms and conditions</label>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>
      </div>
    </div>

    <!-- All Students Data Table Card -->
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0 text-center">All Students Data</h5>
      </div>
      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
          <thead class="thead-light">
            <tr>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Education</th>
              <th scope="col">City</th>
              <th scope="col">Gender</th>
              <th scope="col">Age</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">1</th>
              <td>Ahmed</td>
              <td>BSCS</td>
              <td>Rawalpindi</td>
              <td>Male</td>
              <td>23</td>
            </tr>
            <tr>
              <th scope="row">2</th>
              <td>Ali</td>
              <td>BBA</td>
              <td>Islamabad</td>
              <td>Male</td>
              <td>22</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
